relevance_check: |
  Given the following user query and JIRA search results, identify which ticket keys are most relevant.
  Return ONLY a comma-separated list of ticket keys (e.g., "PROJ-1, PROJ-5, PROJ-8").
  If none are relevant, return "NONE".

  User query: {user_prompt}

  Search results:
  {tickets_summary}

  Relevant ticket keys:

search_analysis: |
  Analyze the following JIRA search results in context of the user's query.
  Provide a clear, helpful summary of the results.

  User query: {user_prompt}

  Search results:
  {tickets_summary}

  Provide a well-formatted response summarizing these results for the user.

analyze_search_results: |
  Analyze the following JIRA search results and provide a helpful summary for the user.

  User query: {user_prompt}

  Search results:
  {tickets_summary}

  Context: {context_info}
  {history_context}

  Instructions:
  - Summarize the results clearly
  - Highlight key tickets and their statuses
  - Note any patterns or trends
  {history_note}

  Provide a well-formatted response:

