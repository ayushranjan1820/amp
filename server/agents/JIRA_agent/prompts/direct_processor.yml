enhance_description: |
  Enhance the following JIRA ticket description using relevant knowledge base content.
  Create a professional, well-structured description in Markdown format.

  Issue type: {issue_type}
  Summary: {summary_text}

  Knowledge base content:
  {kb_content}

  Generate an enhanced description with proper sections (Overview, Details, Requirements, Acceptance Criteria as appropriate).

build_codebase_ticket_description: |
  Build a JIRA ticket description in Markdown using the provided codebase context.

  You MUST include these exact sections and headings:
  ## Technical Details
  ## Related Files and Folders
  ## Implementation Steps
  ## Acceptance Criteria
  ## Definition of Done

  Requirements:
  - Use only facts available in User Request, Existing Description, and Codebase Context.
  - Do not invent files, APIs, classes, or behavior that are not present in Codebase Context.
  - Under "Related Files and Folders", list concrete paths from the context when available.
  - Under "Implementation Steps", provide ordered actionable steps.
  - Under "Acceptance Criteria", provide testable outcomes.
  - Under "Definition of Done", include quality gates (tests, review, validation).
  - Output Markdown only (no JSON, no explanation, no preamble).

  Issue type: {issue_type}
  Summary: {summary_text}
  User Request: {user_prompt}
  Existing Description: {existing_description}

  Codebase Context:
  {codebase_context}

  Markdown Description:

