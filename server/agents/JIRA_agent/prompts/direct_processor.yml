  Extract update details from the user's message for ticket {ticket_key}. Return ONLY valid JSON
  with double-quoted keys and strings (no markdown fences). Use this flat shape — omit keys you are not updating:
  {{
    "ticket_key": "{ticket_key}",
    "status": null,
    "priority": null,
    "summary": null,
    "description": null,
    "labels": null,
    "comment": null
  }}

  User message: {user_prompt}

  JSON:

